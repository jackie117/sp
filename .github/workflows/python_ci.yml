name: python_ci
run-name: "Python CI #${{ github.run_number }}"

on:
    repository_dispatch:
        types:
            - python_ci
    workflow_dispatch:
        inputs:
            target_ref:
                description: "branch, tag, or SHA to test"
                required: true
                default: "main"
                type: string
    workflow_call:
        inputs:
            target_ref:
                description: "branch, tag, or SHA to test"
                required: true
                type: string
        secrets:
            TARGET_REPOSITORY:
                required: true
            CHECKOUT_DEPLOY_KEY:
                required: true

permissions:
    contents: read

concurrency:
    group: python-ci
    cancel-in-progress: true

jobs:
    python_quality:
        name: python_quality
        runs-on: windows-latest
        timeout-minutes: 45
        env:
            # 子进程会打印非 ASCII 断言文案；runner 默认代码页（charmap）下子进程会
            # UnicodeEncodeError。测试侧按 encoding="utf-8" 读取子进程输出，统一让
            # 子进程以 UTF-8 写 stdio
            PYTHONUTF8: "1"
            PYTHONIOENCODING: utf-8
        steps:
            - name: resolve_target_ref
              id: target_ref
              shell: bash
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  DISPATCH_TARGET_SHA: ${{ github.event.client_payload.target_sha }}
                  INPUT_TARGET_REF: ${{ inputs.target_ref }}
              run: |
                  # 转发触发用确切 SHA；手动/复用触发用输入 ref
                  if [[ "${EVENT_NAME}" == "repository_dispatch" ]]; then
                      echo "value=${DISPATCH_TARGET_SHA}" >> "${GITHUB_OUTPUT}"
                  else
                      echo "value=${INPUT_TARGET_REF}" >> "${GITHUB_OUTPUT}"
                  fi

            - name: checkout_target
              shell: bash
              env:
                  TARGET_REPOSITORY: ${{ secrets.TARGET_REPOSITORY }}
                  CHECKOUT_DEPLOY_KEY: ${{ secrets.CHECKOUT_DEPLOY_KEY }}
                  TARGET_REF: ${{ steps.target_ref.outputs.value }}
              run: |
                  # 手工克隆替代 actions/checkout：后者会把目标仓地址写进步骤日志。
                  # 错误输出统一脱敏，叠加 secret 自带的日志掩码双保险
                  if [[ -z "${TARGET_REF}" || -z "${TARGET_REPOSITORY}" || -z "${CHECKOUT_DEPLOY_KEY}" ]]; then
                      echo "missing checkout configuration" >&2
                      exit 1
                  fi

                  # RUNNER_TEMP 在 Windows 是反斜杠路径；GIT_SSH_COMMAND 经 sh -c 执行时
                  # 反斜杠会被当转义符吞掉，统一转正斜杠（git 自带 ssh 与 Windows ssh 都兼容）
                  key_file="${RUNNER_TEMP//\\//}/checkout_key"
                  printf '%s\n' "${CHECKOUT_DEPLOY_KEY}" > "${key_file}"
                  chmod 600 "${key_file}"
                  export GIT_SSH_COMMAND="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

                  url="git@github.com:${TARGET_REPOSITORY}.git"
                  redact() { sed "s#${TARGET_REPOSITORY}#[target]#g; s#${url}#[target]#g"; }

                  if ! git clone --quiet "${url}" target 2> >(redact >&2); then
                      echo "clone failed" >&2
                      exit 1
                  fi
                  if ! git -C target checkout --quiet "${TARGET_REF}" 2> >(redact >&2); then
                      echo "checkout ref failed" >&2
                      exit 1
                  fi
                  rm -f "${key_file}"
                  echo "checkout ok"

            - name: setup_python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"

            - name: setup_node
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: install_pytest
              # setuptools 供部分用例进程内 import（Distribution/setup）
              shell: bash
              working-directory: target
              run: python -m pip install --disable-pip-version-check pytest setuptools

            - name: python_quality
              # TEMP 指到无 8.3 别名的工作区临时目录，避免与路径归一化错位
              # （runner 上下文只在步骤级 env 可用，不能放 job 级）
              shell: bash
              working-directory: target
              env:
                  TEMP: ${{ runner.temp }}
                  TMP: ${{ runner.temp }}
              run: python -m pytest -q
