name: si_full_ci
run-name: "Full CI · ${{ github.event.client_payload.target_source || inputs.target_ref }}"

on:
    repository_dispatch:
        types:
            - si_full_ci
            # 兼容别名：私有仓 main 上的触发器还在发旧事件名 full_ci，
            # 私有仓合入 si_full_ci 对齐后可移除
            - full_ci
    workflow_dispatch:
        inputs:
            target_ref:
                description: "branch, tag, or SHA to test"
                required: true
                default: "main"
                type: string

permissions:
    contents: read

concurrency:
    group: full-ci
    cancel-in-progress: true

jobs:
    prepare:
        name: prepare
        runs-on: ubuntu-latest
        outputs:
            target_ref: ${{ steps.context.outputs.target_ref }}
        steps:
            - name: resolve_context
              id: context
              shell: bash
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  DISPATCH_TARGET_SHA: ${{ github.event.client_payload.target_sha }}
                  INPUT_TARGET_REF: ${{ inputs.target_ref }}
              run: |
                  # 转发触发用确切 SHA；手动触发用输入 ref（默认 main）
                  if [[ "${EVENT_NAME}" == "repository_dispatch" ]]; then
                      echo "target_ref=${DISPATCH_TARGET_SHA}" >> "${GITHUB_OUTPUT}"
                  else
                      echo "target_ref=${INPUT_TARGET_REF}" >> "${GITHUB_OUTPUT}"
                  fi

    python_ci:
        needs: prepare
        uses: ./.github/workflows/si_python_ci.yml
        with:
            target_ref: ${{ needs.prepare.outputs.target_ref }}
        secrets: inherit

    ts_ci:
        needs: prepare
        uses: ./.github/workflows/si_ts_ci.yml
        with:
            target_ref: ${{ needs.prepare.outputs.target_ref }}
        secrets: inherit

    cpp_ci:
        needs: prepare
        uses: ./.github/workflows/si_cpp_ci.yml
        with:
            target_ref: ${{ needs.prepare.outputs.target_ref }}
        secrets: inherit
