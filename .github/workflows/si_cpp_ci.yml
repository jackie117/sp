name: si_cpp_ci
run-name: "C++ CI · ${{ github.event.client_payload.target_source || inputs.target_ref }}"

on:
    repository_dispatch:
        types:
            - si_cpp_ci
    workflow_dispatch:
        inputs:
            target_ref:
                description: "branch, tag, or SHA to test"
                required: true
                default: "main"
                type: string
    workflow_call:
        inputs:
            target_ref:
                description: "branch, tag, or SHA to test"
                required: true
                type: string
        secrets:
            TARGET_REPOSITORY:
                required: true
            CHECKOUT_DEPLOY_KEY:
                required: true

permissions:
    contents: read

concurrency:
    # 并发组按被测目标分组（payload 的最小化来源标识 main / PR #N）：
    # 不同 PR 与 main 之间互不取消；同目标再触发仍新取消旧。被 si_full_ci 以
    # workflow_call 编排时键退化为每次不同的 SHA，串行/抢占由调用方的按目标组负责
    group: "cpp-ci-${{ github.event.client_payload.target_source || inputs.target_ref || github.run_id }}"
    cancel-in-progress: true

jobs:
    cpp_quality:
        name: cpp_quality
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - name: resolve_target_ref
              id: target_ref
              shell: bash
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  DISPATCH_TARGET_SHA: ${{ github.event.client_payload.target_sha }}
                  INPUT_TARGET_REF: ${{ inputs.target_ref }}
              run: |
                  # 转发触发用确切 SHA；手动/复用触发用输入 ref
                  if [[ "${EVENT_NAME}" == "repository_dispatch" ]]; then
                      echo "value=${DISPATCH_TARGET_SHA}" >> "${GITHUB_OUTPUT}"
                  else
                      echo "value=${INPUT_TARGET_REF}" >> "${GITHUB_OUTPUT}"
                  fi

            - name: checkout_target
              shell: bash
              env:
                  TARGET_REPOSITORY: ${{ secrets.TARGET_REPOSITORY }}
                  CHECKOUT_DEPLOY_KEY: ${{ secrets.CHECKOUT_DEPLOY_KEY }}
                  TARGET_REF: ${{ steps.target_ref.outputs.value }}
              run: |
                  # 手工克隆替代 actions/checkout：后者会把目标仓地址写进步骤日志。
                  # 错误输出统一脱敏，叠加 secret 自带的日志掩码双保险
                  if [[ -z "${TARGET_REF}" || -z "${TARGET_REPOSITORY}" || -z "${CHECKOUT_DEPLOY_KEY}" ]]; then
                      echo "missing checkout configuration" >&2
                      exit 1
                  fi

                  # RUNNER_TEMP 在 Windows 是反斜杠路径；GIT_SSH_COMMAND 经 sh -c 执行时
                  # 反斜杠会被当转义符吞掉，统一转正斜杠（git 自带 ssh 与 Windows ssh 都兼容）
                  key_file="${RUNNER_TEMP//\\//}/checkout_key"
                  printf '%s\n' "${CHECKOUT_DEPLOY_KEY}" > "${key_file}"
                  chmod 600 "${key_file}"
                  export GIT_SSH_COMMAND="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

                  url="git@github.com:${TARGET_REPOSITORY}.git"
                  redact() { sed "s#${TARGET_REPOSITORY}#[target]#g; s#${url}#[target]#g"; }

                  if ! git clone --quiet "${url}" target 2> >(redact >&2); then
                      echo "clone failed" >&2
                      exit 1
                  fi
                  if ! git -C target checkout --quiet "${TARGET_REF}" 2> >(redact >&2); then
                      echo "checkout ref failed" >&2
                      exit 1
                  fi
                  rm -f "${key_file}"
                  echo "checkout ok"

            - name: configure
              shell: bash
              run: cmake -S target/source/local_pr_console -B build -A x64

            - name: build_tests_target
              # 只构建测试目标：ALL 目标含 app 的 icacls POST_BUILD（写 SACL），
              # 在受特权限制的环境必失败；CTest 只需要测试目标
              shell: bash
              run: cmake --build build --config Debug --target local_pr_console_tests

            - name: cpp_quality
              shell: bash
              # --timeout 300：单测试 5 分钟上限。挂起的测试以失败收场并输出其日志，
              # 而非等满任务级 30 分钟被杀——被杀步骤日志可能不上传，事后无从定位
              run: ctest --test-dir build -C Debug --output-on-failure --timeout 300
